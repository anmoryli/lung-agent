<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>患者对话 · OpenClaw</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --panel: #fffefa;
      --ink: #1f302d;
      --muted: #78837d;
      --line: #e5e7df;
      --green: #2e6757;
      --green-soft: #e7f0eb;
      --orange: #a76037;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 265px minmax(0, 1fr); }
    aside { padding: 30px 22px; border-right: 1px solid var(--line); background: #f2f1e9; display: flex; flex-direction: column; gap: 30px; }
    .brand { display: flex; align-items: center; gap: 12px; font: 600 20px Georgia, serif; letter-spacing: -.3px; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px 13px 13px 4px; background: var(--green); color: white; font: 20px Georgia, serif; }
    .side-label, .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .session-card { padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,254,250,.78); }
    .session-card p { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; overflow-wrap: anywhere; }
    .patient-id { margin-top: 12px; width: 100%; padding: 10px 11px; color: var(--ink); border: 1px solid var(--line); background: white; border-radius: 9px; outline-color: var(--green); font-size: 13px; }
    .side-bottom { margin-top: auto; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .side-bottom a { color: var(--green); text-decoration: none; }
    main { display: flex; flex-direction: column; min-height: 100vh; max-height: 100vh; }
    .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 5vw, 70px); border-bottom: 1px solid var(--line); background: rgba(255,254,250,.7); }
    .title h1 { margin: 0; font: 500 20px Georgia, "Microsoft YaHei", serif; }
    .title p { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .connection { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d2a24e; }
    .dot.online { background: #4e9a72; box-shadow: 0 0 0 3px #4e9a721a; }
    .icon-button { height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font-size: 12px; }
    .conversation { flex: 1; overflow: auto; padding: 36px clamp(18px, 9vw, 130px) 20px; scroll-behavior: smooth; }
    .welcome { max-width: 580px; margin: 10vh auto 0; text-align: center; animation: rise .5s ease both; }
    .welcome-icon { margin: auto auto 22px; width: 56px; height: 56px; display: grid; place-items: center; color: var(--green); background: var(--green-soft); border-radius: 20px 20px 20px 6px; font-size: 25px; }
    .welcome h2 { margin: 0; font: 500 clamp(26px, 4vw, 36px) Georgia, "Microsoft YaHei", serif; letter-spacing: -.6px; }
    .welcome p { margin: 13px auto 25px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .suggestion { padding: 10px 13px; border: 1px solid #dfe4db; border-radius: 999px; background: #fffefa; color: #486158; font-size: 12px; transition: .18s ease; }
    .suggestion:hover { border-color: #9bb9a8; background: #f1f6f1; transform: translateY(-1px); }
    .message { display: flex; gap: 12px; max-width: 760px; margin: 0 auto 25px; animation: rise .22s ease both; }
    .message.user { justify-content: flex-end; }
    .avatar { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 11px 11px 11px 3px; background: var(--green-soft); color: var(--green); font-size: 13px; }
    .bubble { max-width: min(82%, 650px); padding: 13px 16px; border: 1px solid var(--line); border-radius: 4px 15px 15px 15px; background: var(--panel); font-size: 14px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user .bubble { border: 0; border-radius: 15px 4px 15px 15px; color: white; background: var(--green); }
    .bubble.pending:after { content: ""; display: inline-block; width: 6px; height: 15px; margin-left: 3px; vertical-align: -2px; background: #85a798; animation: blink 1s steps(2) infinite; }
    .message-error .bubble { border-color: #edd8ca; color: #8e4f2f; background: #fff8f2; }
    .interrupt { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .interrupt p { margin: 0 0 10px; color: #66584d; font-size: 12px; }
    .interrupt-actions { display: flex; gap: 8px; }
    .interrupt-actions button { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: white; font-size: 12px; }
    .interrupt-actions .approve { color: white; border-color: var(--green); background: var(--green); }
    .composer-wrap { padding: 10px clamp(18px, 9vw, 130px) 22px; }
    .composer { max-width: 760px; margin: 0 auto; padding: 10px 11px 9px 16px; border: 1px solid #dfe2d8; border-radius: 17px; background: var(--panel); box-shadow: 0 8px 30px #253e2d0a; }
    textarea { display: block; width: 100%; min-height: 48px; max-height: 170px; resize: vertical; padding: 7px 2px; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 14px; line-height: 1.6; }
    textarea::placeholder { color: #9aa39d; }
    .composer-row { display: flex; align-items: center; justify-content: space-between; }
    .hint { color: #98a099; font-size: 11px; }
    .send-actions { display: flex; gap: 8px; }
    .send-button, .stop-button { min-width: 76px; height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 10px; color: white; background: var(--green); font-size: 12px; font-weight: 600; }
    .send-button:disabled { cursor: not-allowed; opacity: .48; }
    .stop-button { color: #874b2e; background: #f8ece3; }
    .disclaimer { max-width: 760px; margin: 9px auto 0; text-align: center; color: #929b94; font-size: 10px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes blink { to { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      main { max-height: 100svh; min-height: 100svh; }
      .topbar { height: 66px; padding: 0 16px; }
      .title h1 { font-size: 18px; }
      .connection { font-size: 0; }
      .icon-button { padding: 0 9px; }
      .conversation { padding: 28px 15px 14px; }
      .welcome { margin-top: 8vh; }
      .bubble { max-width: 88%; }
      .composer-wrap { padding: 8px 12px 14px; }
      .hint { max-width: 45%; line-height: 1.4; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><span class="brand-mark">＋</span><span>OpenClaw Care</span></div>
      <section>
        <div class="side-label">当前会话</div>
        <div class="session-card" style="margin-top:12px">
          <div class="eyebrow">Patient chat</div>
          <p>与患者服务助手交流。刷新页面后，会话编号和本页消息会保留。</p>
          <label class="sr-only" for="patientId">合成患者编号</label>
          <input id="patientId" class="patient-id" value="demo-patient-0001" aria-label="合成患者编号">
        </div>
      </section>
      <section>
        <div class="side-label">服务能力</div>
        <div class="session-card" style="margin-top:12px">
          <p>复诊准备 · 报告咨询<br>检查与医嘱 · 服务申请<br>健康问题安全分流</p>
        </div>
      </section>
      <div class="side-bottom">演示环境仅使用合成患者数据。<br><a href="/health" target="_blank" rel="noreferrer">查看服务状态 ↗</a></div>
    </aside>
    <main>
      <header class="topbar">
        <div class="title"><h1>患者服务助手</h1><p>把今天想问的事告诉我</p></div>
        <div class="top-actions">
          <span class="connection"><i id="healthDot" class="dot"></i><span id="healthText">正在连接</span></span>
          <button id="newChat" class="icon-button" type="button" title="开始新会话">＋ <span>新会话</span></button>
        </div>
      </header>
      <section id="conversation" class="conversation" aria-live="polite" aria-label="聊天记录">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">✳</div>
          <h2>你好，今天想聊些什么？</h2>
          <p>可以从复诊准备、检查报告或最近的身体变化开始。<br>我会帮你把问题理清楚。</p>
          <div class="suggestions">
            <button class="suggestion" type="button">帮我准备下次复诊的问题</button>
            <button class="suggestion" type="button">我想了解检查报告</button>
            <button class="suggestion" type="button">最近总觉得没精神</button>
          </div>
        </div>
      </section>
      <div class="composer-wrap">
        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">输入你的问题</label>
          <textarea id="messageInput" placeholder="写下你想问的事…" rows="2" required></textarea>
          <div class="composer-row">
            <span class="hint">Enter 发送 · Shift + Enter 换行</span>
            <div class="send-actions">
              <button id="stopButton" class="stop-button" type="button" hidden>停止</button>
              <button id="sendButton" class="send-button" type="submit">发送 <span aria-hidden="true">↗</span></button>
            </div>
          </div>
        </form>
        <p class="disclaimer">助手提供的信息用于沟通和就医准备，不能替代医生诊断。</p>
      </div>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
