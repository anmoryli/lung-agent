services:
  agent-service:
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      DEEPAGENTS_MODEL: ${DEEPAGENTS_MODEL:-openai:deepseek-flash}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-lung-agent}
      AGENT_BIND_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8010
      AGENT_STORAGE_PATH: /app/storage
      AGENT_MODEL_DIR: /app/models
      AGENT_CORS_ORIGINS: ${AGENT_CORS_ORIGINS:-*}
      AGENT_AGUI_PUSH_STATE: ${AGENT_AGUI_PUSH_STATE:-true}
      AGENT_TIMEZONE: ${AGENT_TIMEZONE:-Asia/Shanghai}
      PATIENT_MEMORY_EXTRACTION_INTERVAL_SECONDS: ${PATIENT_MEMORY_EXTRACTION_INTERVAL_SECONDS:-15}
      PATIENT_MEMORY_DELETION_INTERVAL_SECONDS: ${PATIENT_MEMORY_DELETION_INTERVAL_SECONDS:-3}
      FHIR_MCP_URL: ${FHIR_MCP_URL:-http://host.docker.internal:8001/mcp}
      KNOWLEDGE_PLATFORM_URL: ${KNOWLEDGE_PLATFORM_URL:-http://host.docker.internal:8020}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      FHIR_MCP_HOST_HEADER: ${FHIR_MCP_HOST_HEADER:-localhost:8001}
    volumes:
      - ./storage:/app/storage
      - ../knowledge-platform/models:/app/models
    restart: unless-stopped
