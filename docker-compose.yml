services:
  agent-service:
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      DEEPAGENTS_MODEL: ${DEEPAGENTS_MODEL:-openai:deepseek-flash}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-lung-agent}
      AGENT_BIND_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8010
      AGENT_STORAGE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
