[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.mypy]
python_version = "3.10"
files = [
    "backend/integrations/mcp/patient_fhir.py",
]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
